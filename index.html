<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P4 SCHEDULE 4P</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">

    <header class="page-header">
      <div>
        <p class="eyebrow">CAMPUS SCHEDULE ASSISTANT</p>
        <h1>P4 SCHEDULE 4P</h1>
      </div>

      <div class="week-switcher" aria-label="周数切换">
        <button id="prevWeek" type="button" aria-label="上一周">←</button>
        <span id="weekLabel">第 1 周</span>
        <button id="nextWeek" type="button" aria-label="下一周">→</button>
      </div>

      <p class="semester">2026 秋季学期</p>
    </header>

    <section class="schedule-panel">
      <div
        id="scheduleGrid"
        class="schedule-grid"
        aria-label="课程表"
      ></div>
    </section>

    <!-- 课程详情弹窗 -->
    <div id="courseModal" class="course-modal hidden" aria-hidden="true">

      <div class="course-modal-backdrop"></div>

      <section
        class="course-detail"
        role="dialog"
        aria-modal="true"
        aria-labelledby="detailCourseName"
      >

        <button
          id="closeCourseModal"
          class="course-detail-close"
          type="button"
          aria-label="关闭课程详情"
        >
          ×
        </button>

        <p class="detail-eyebrow">课程详情</p>
        <h2 id="detailCourseName"></h2>

        <div class="course-detail-info">
          <p>
            <span class="detail-label">教师</span>
            <span id="detailTeacher"></span>
          </p>

          <p>
            <span class="detail-label">地点</span>
            <span id="detailLocation"></span>
          </p>

          <p>
            <span class="detail-label">时间</span>
            <span id="detailTime"></span>
          </p>

          <p>
            <span class="detail-label">日期</span>
            <span id="detailDate"></span>
          </p>

          <p>
            <span class="detail-label">类型</span>
            <span id="detailCourseType"></span>
          </p>
        </div>

        <section class="skip-index-section">

          <div class="skip-index-title">
            <div>
              <p class="skip-index-eyebrow">Skip Index</p>
              <h3>翘课指数</h3>
            </div>
          </div>

          <!-- 已经有评分时显示 -->
          <div id="skipResult" class="skip-result hidden">

            <div class="skip-main-result">
              <div>
                <div class="skip-score-line">
                  <span id="skipScore" class="skip-score">82</span>
                  <span class="skip-score-unit">/ 100</span>
                </div>

                <div id="skipLevel" class="skip-level">
                  很适合翘
                </div>
              </div>
            </div>

            <div class="skip-metrics">

              <div class="skip-metric">
                <div class="skip-metric-header">
                  <span>预计点名风险</span>
                  <strong id="attendanceRiskLabel">低</strong>
                </div>

                <div
                  class="metric-track"
                  role="progressbar"
                  aria-label="预计点名风险"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                >
                  <div id="attendanceRiskBar" class="metric-bar"></div>
                </div>
              </div>

              <div class="skip-metric">
                <div class="skip-metric-header">
                  <span>自学替代性</span>
                  <strong id="selfStudyLabel">高</strong>
                </div>

                <div
                  class="metric-track"
                  role="progressbar"
                  aria-label="自学替代性"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                >
                  <div id="selfStudyBar" class="metric-bar"></div>
                </div>
              </div>

            </div>

            <p class="skip-result-note">
              综合点名风险、缺席后果和自学替代性计算。
            </p>

            <p id="skipEvaluatedTime" class="skip-evaluated-time"></p>

          </div>

          <!-- 首次无结果时直接展开；已有结果时默认隐藏 -->
          <div id="skipQuestionnaire" class="skip-questionnaire hidden">

            <div class="questionnaire-intro">
              <h4>快速评估</h4>
              <p>
                共 10 题。分数越高，代表这门课的缺席风险越低、越容易通过资料自学替代。
              </p>
            </div>

            <form id="skipQuestionForm">
              <div id="questionnaireQuestions"></div>

              <p
                id="questionnaireMessage"
                class="questionnaire-message"
                aria-live="polite"
              ></p>

              <button
                class="skip-primary-button"
                type="submit"
              >
                计算翘课指数
              </button>
            </form>

          </div>

          <button
            id="retestSkipIndex"
            class="skip-secondary-button hidden"
            type="button"
          >
            重新评估
          </button>

        </section>

      </section>
    </div>

  </main>

  <script src="app.js"></script>

</body>
</html>
